<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aksieman</title>
  <meta name="description" content="Aksieman. Passionate about possibilities. Turning ideas into reality. Coming soon.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Newsreader:ital,opsz,wght@1,6..72,300..600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80' font-family='Arial Black'>A</text><circle cx='78' cy='72' r='12' fill='%23C25E2E'/></svg>">
  <style>
    :root {
      --paper: #FAF8F4;
      --ink: #211F1B;
      --ink-soft: #56524A;
      --stone: #8B867B;
      --forest: #2E4A3B;
      --orange: #C2551F;
      --line: #DFD9CD;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink);
      font-family: "Newsreader", Georgia, serif;
      text-align: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .topo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: var(--line);
      opacity: 0.8;
      z-index: 0;
    }
    .topo .route { stroke: var(--orange); opacity: 0.5; }
    main { position: relative; z-index: 1; max-width: 40rem; }
    .mark {
      font-family: "Archivo", system-ui, sans-serif;
      font-stretch: 122%;
      font-weight: 850;
      font-size: clamp(2.6rem, 9vw, 4.8rem);
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .mark span { color: var(--orange); }
    .tag {
      font-style: italic;
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      color: var(--ink-soft);
      margin-top: 1.1rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 2.6rem;
      font-family: "Archivo", system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--forest);
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 0.7rem 1.4rem;
      background: rgba(255, 255, 255, 0.5);
    }
    .badge i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--orange);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .note {
      margin-top: 1.6rem;
      color: var(--stone);
      font-size: 1.05rem;
      line-height: 1.6;
    }
    footer {
      position: absolute;
      bottom: 1.6rem;
      left: 0;
      right: 0;
      z-index: 1;
      font-family: "Archivo", system-ui, sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--stone);
    }
    @media (prefers-reduced-motion: reduce) { .badge i { animation: none; } }
  </style>
</head>
<body>
  <svg class="topo" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="1.1">
      <path d="M-50,620 C200,540 380,660 620,580 C860,500 1020,600 1250,520"/>
      <path d="M-50,560 C180,480 400,590 640,510 C880,430 1040,540 1250,460"/>
      <path d="M-50,500 C160,430 420,520 660,445 C900,370 1060,480 1250,400"/>
      <path d="M-50,440 C150,380 440,455 680,385 C920,315 1080,420 1250,345"/>
      <path d="M-50,380 C140,330 460,390 700,330 C940,268 1100,360 1250,295"/>
    </g>
    <path class="route" d="M-40,700 C240,610 340,650 520,540 C700,430 640,360 820,300 C1000,240 1080,280 1260,170"
          fill="none" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round"/>
  </svg>

  <main>
    <p class="mark">AKSIEMAN<span>.</span></p>
    <p class="tag">Passionate about possibilities. Turning ideas into reality.</p>
    <p class="badge"><i></i>Coming soon</p>
    <p class="note">Something is being built here. Every great achievement begins with a possibility &middot; this one is almost ready.</p>
  </main>

  <footer>Exploring ideas &middot; Building solutions &middot; Creating impact</footer>
</body>
</html>
